  lead: >-
    This book presents a revealing portrait of the spectacular rise of the Front
    National, from complete outsider to a possible winner of next year's French
    presidential elections, in the form of three distinct but intimately connected
    photo essays.
  body:
    - >-
      A photographic record of French history in the making – it covers the period
      from September 1990 to November 2023 – it is all the more remarkable not one
      French publisher dared take on the project.
    - >-
      The Front national (FN), since 2017 better known as the much less abrasive
      sounding Rassemblement national (RN, the National Rally), is the French
      far-right party that served as the ideological forerunner to many other
      far-right movements that have emerged across Europe over the past few decades
      such as the Dutch PVV of Geert Wilders or the AFD in Germany, to name but a
      few.
    - >-
      Contrary to these parties, however, the FN/RN is strictly a family business.
      Founded as long ago as 1972 by Jean-Marie Le Pen, it was Marine, his youngest
      daughter, to whom he ceded the presidency. And as recent events have shown,
      Marion Maréchal-Le Pen, her niece and his grand-daughter, is on her way to
      replace the young Jordan Bardella as Marine's heir apparent. Blood, so it
      appears, proves once again thicker than water.
    - >-
      It is these three (and a half) leading figures then that make up the major part
      of this highly topical publication.
    - >-
      The book concludes with an incisive essay by the French historian Nicolas
      Lebourg, a widely respected specialist of far-right movements.
  bio: >-
    Jeremy Stigter is a largely self-taught Dutch photographer (The Hague, 1958) who
    has lived in Paris for over 40 years. He took up photography during an extended
    stay in Japan where an encounter with the well-known Dutch photographer Ed van
    der Elsken proved decisive (1986). His work is strongly marked by literary and
    cinematographic influences and tends to explore, in a variety of ways, the
    medium's documentary function, its psychological effect and its narrative
    possibilities. Thus, his first book, <i>The Jewish Bride – a photoplay</i>
    (Nazraeli Press, USA 2008) is an account of an amorous encounter in the form of a
    “theatrical documentary”. In contrast, his second book, <i>Vivre</i> (Le Seuil,
    Paris 2012), presents an in-depth study of daily life in a hospital for cancer
    patients. After contributing portraits of well-known scientists (among whom the
    unforgettable Jane Goodall) to <i>Savoir, Penser, Rêver</i> (Flammarion 2018),
    Jeremy Stigter published <i>Visiting Mister Ueda</i> (Zen Foto Gallery, Tokyo
    2021) an account, in words and pictures, of his visit to the great Japanese
    photographer, Shoji Ueda, in his home province of Tottori. Over the years, Jeremy
    Stigter's work has appeared in numerous magazine and newspapers. He has had
    exhibitions in Paris, Tokyo, Amsterdam, Rome and, most recently, Antwerp.
