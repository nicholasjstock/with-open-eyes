  lead: >-
    Ce livre présente un portrait révélateur de l'ascension spectaculaire du Front
    national (FN), aujourd'hui dénommé le Rassemblement national (RN), d'outsider
    complet à possible vainqueur des prochaines élections présidentielles françaises
    à travers trois essais photographiques distincts mais intimement liés.
  body:
    - >-
      Couvrant la période de septembre 1990 à novembre 2023, ce témoignage
      photographique des évolutions politiques d'un chapitre de l'Histoire de France
      n'a pas trouvé d'éditeur français. Il est regrettable que l'on cherche à
      occulter un regard posé sur ce sujet.
    - >-
      Le parti fait du jeu politique une affaire de famille, en ce que le
      protagoniste au pouvoir est un héritier de sang : Jean-Marie, le patriarche,
      Marine, sa plus jeune fille, ou, éventuellement, Marion, sa petite fille et
      nièce de Marine. Ce sont ces trois figures qui jouent consécutivement le rôle
      principal au sein de la mise en scène de chacun des chapitres du livre.
    - >-
      Étant donné que ce parti peut être considéré comme un précurseur idéologique
      des nombreux mouvements d'extrême droite qui ont émergé en Europe ces
      dernières décennies, Lecturis a choisi une édition bilingue – français et
      anglais.
    - >-
      Le livre se conclut avec une analyse pénétrante de l'historien Nicolas
      Lebourg, un des grands spécialistes des mouvements d'extrême droite.
  bio: >-
    Photographe néerlandais, Jeremy Stigter (La Haye, 1958) habite Paris depuis plus
    de 40 ans. Autodidacte, il se consacre à la photographie lors d'un long séjour à
    Tokyo, où sa rencontre avec le célèbre photographe néerlandais Ed van der Elsken
    s'avère déterminante (1986). La littérature et le cinéma, en particulier,
    influencent son travail. Ce qui l'intéresse le plus dans la photographie, c'est
    la manière dont sa fonction documentaire et son impact psychologique ouvrent un
    vaste champ de possibilités narratives. Ainsi, son premier livre,
    <i>The Jewish Bride – a photo play</i> (Nazraeli Press, 2008) présente le récit
    d'une rencontre amoureuse sous la forme d'un « documentaire théâtral » hautement
    onirique. À l'inverse, son second livre, <i>Vivre</i> (Le Seuil, 2012), offre un
    récit immersif du quotidien dans un hôpital pour patients atteints de cancer.
    Après avoir réalisé les portraits de scientifiques de renom, parmi lesquels Jane
    Goodall, pour l'ouvrage <i>Savoir, Penser, Rêver</i> (Flammarion, 2018), il a
    publié <i>Visiting Mister Ueda</i> (Zen Foto, 2021), récit, en mots et en images,
    de sa visite chez Shoji Ueda, le grand photographe japonais. Au fil des ans, le
    travail de Stigter a paru dans de nombreux magazines et journaux. Il a exposé à
    Paris, Tokyo, Amsterdam, Rome et, plus récemment, à Anvers.
